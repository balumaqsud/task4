services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-c62e5bf7e0d37e4c9213fb71629fa2a8}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      MAILER_SENDER: ${MAILER_SENDER:-no-reply@localhost}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    command: >-
      sh -c "php bin/console cache:clear --no-warmup
      && php bin/console doctrine:migrations:migrate --no-interaction
      && chown -R www-data:www-data var/cache var/log
      && apache2-foreground"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-c62e5bf7e0d37e4c9213fb71629fa2a8}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      MAILER_SENDER: ${MAILER_SENDER:-no-reply@localhost}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    command: php bin/console messenger:consume async --no-interaction --time-limit=3600
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
