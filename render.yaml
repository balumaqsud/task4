services:
  - type: web
    name: user-management-web
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: user-management-db
          property: connectionString
      - key: MESSENGER_TRANSPORT_DSN
        value: sync://
      - key: MAILER_DSN
        sync: false
      - key: MAILER_SENDER
        sync: false
      - key: DEFAULT_URI
        sync: false

databases:
  - name: user-management-db
    plan: free
    databaseName: app
    user: app
